<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"
        integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous">
        </script>

    <script>
        async function encryptString(text, key) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);

            // Generate a key from the password
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw",
                encoder.encode(key),
                "PBKDF2",
                false,
                ["deriveBits", "deriveKey"]
            );

            // Generate a random salt
            const salt = window.crypto.getRandomValues(new Uint8Array(16));

            // Derive the key using PBKDF2
            const cryptoKey = await window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: 100000,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-CBC", length: 256 },
                false,
                ["encrypt"]
            );

            // Generate IV
            const iv = window.crypto.getRandomValues(new Uint8Array(16));

            // Encrypt the data
            const encrypted = await window.crypto.subtle.encrypt(
                { name: "AES-CBC", iv: iv },
                cryptoKey,
                data
            );

            // Combine salt, IV, and encrypted data
            const encryptedArray = new Uint8Array(encrypted);
            const result = {
                salt: Array.from(salt).map(b => b.toString(16).padStart(2, '0')).join(''),
                iv: Array.from(iv).map(b => b.toString(16).padStart(2, '0')).join(''),
                data: Array.from(new Uint8Array(encrypted)).map(b => b.toString(16).padStart(2, '0')).join('')
            };

            return `${result.salt}:${result.iv}:${result.data}`;
        }
    </script>
    <title>Quick Secret Chat</title>
</head>

<body>
    <div class="mx-auto max-w-2xl">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-900">Quick Secret Chat</h1>
            <p class="mt-2 text-gray-600">Send encrypted messages securely</p>
        </div>

        <div class="rounded-lg bg-white p-6 shadow-lg">
            <form action="" id="message-form" class="space-y-4">
                <div>
                    <label for="text" class="block text-sm font-medium text-gray-700 mb-2">
                        Your Message
                    </label>
                    <textarea id="text" rows="4"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50"
                        placeholder="Enter your secret message here...">
                    </textarea>

                    <div class="mt-4">
                        <label for="secret-key" class="block text-sm font-medium text-gray-700 mb-2">
                            Secret Key
                        </label>
                        <input type="password" id="secret-key"
                            class="w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50"
                            placeholder="Enter a secret key for encryption">
                    </div>

                    <div class="mt-4 text-center">
                        <a href="decrypt_message.html" class="text-indigo-600 hover:text-indigo-500">
                            Need to decrypt a message?
                        </a>
                    </div>
                </div>

                <div class="flex justify-end">
                    <button type="submit"
                        class="inline-flex items-center rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors duration-200">
                        Send Message
                        <svg xmlns="http://www.w3.org/2000/svg" class="ml-2 h-4 w-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                    </button>
                </div>
            </form>
            <!-- Add this new div for showing the encrypted message -->
            <div id="encrypted-result" class="mt-8 hidden">
                <div class="rounded-lg bg-gray-50 p-6 space-y-4">
                    <div>
                        <h3 class="text-sm font-medium text-gray-900 mb-2">Encrypted Message</h3>
                        <div class="relative">
                            <textarea id="encrypted-text" rows="3" readonly
                                class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 bg-white"></textarea>
                            <button onclick="copyToClipboard('encrypted-text')"
                                class="absolute right-2 top-2 text-sm text-indigo-600 hover:text-indigo-500">
                                Copy
                            </button>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-sm font-medium text-gray-900 mb-2">Secret Key</h3>
                        <div class="relative">
                            <input type="text" id="secret-key-display" readonly
                                class="w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-900 bg-white">
                            <button onclick="copyToClipboard('secret-key-display')"
                                class="absolute right-2 top-2 text-sm text-indigo-600 hover:text-indigo-500">
                                Copy
                            </button>
                        </div>
                    </div>

                    <p class="text-sm text-gray-500">
                        Share the encrypted message and secret key separately with your recipient.
                    </p>
                </div>
            </div>
        </div>
    </div>
    </div>
    </div>
</body>

<script>
    function copyToClipboard(elementId) {
        const element = document.getElementById(elementId);
        element.select();
        document.execCommand('copy');
    }

    $("#message-form").submit(async function (e) {
        e.preventDefault();
        const textAreaValue = $("#text").val().trim();
        const secretKey = $("#secret-key").val().trim();

        if (!textAreaValue || !secretKey) {
            alert("Please enter both a message and a secret key");
            return;
        }

        try {
            const encrypted = await encryptString(textAreaValue, secretKey);
            console.log('Encrypted:', encrypted);

            // Update the result div with encrypted message and key
            $("#encrypted-text").val(encrypted);
            $("#secret-key-display").val(secretKey);
            $("#encrypted-result").removeClass("hidden");

            // Clear the form
            $("#text").val('');
            $("#secret-key").val('');
        } catch (error) {
            console.error('Encryption error:', error);
            alert('Failed to encrypt message. Please try again.');
        }
    });
</script>

</html>
