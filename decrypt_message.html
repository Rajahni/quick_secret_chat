<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"
        integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous">
        </script>
    <script>
        async function decryptString(encryptedText, key) {
            const [saltHex, ivHex, dataHex] = encryptedText.split(':');

            const encoder = new TextEncoder();
            const salt = new Uint8Array(saltHex.match(/.{2}/g).map(byte => parseInt(byte, 16)));
            const iv = new Uint8Array(ivHex.match(/.{2}/g).map(byte => parseInt(byte, 16)));
            const data = new Uint8Array(dataHex.match(/.{2}/g).map(byte => parseInt(byte, 16)));

            // Import the key material
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw",
                encoder.encode(key),
                "PBKDF2",
                false,
                ["deriveBits", "deriveKey"]
            );

            // Derive the key using PBKDF2
            const cryptoKey = await window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: 100000,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-CBC", length: 256 },
                false,
                ["decrypt"]
            );

            // Decrypt the data
            const decrypted = await window.crypto.subtle.decrypt(
                { name: "AES-CBC", iv: iv },
                cryptoKey,
                data
            );

            return new TextDecoder().decode(decrypted);
        }
    </script>
    <title>Decrypt Message - Quick Secret Chat</title>
</head>

<body class="min-h-screen bg-gray-100 p-6">
    <div class="mx-auto max-w-2xl">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-900">Decrypt Message</h1>
            <p class="mt-2 text-gray-600">Enter the encrypted message and secret key to decrypt</p>
        </div>

        <div class="rounded-lg bg-white p-6 shadow-lg">
            <form id="decrypt-form" class="space-y-4">
                <div>
                    <label for="encrypted-message" class="block text-sm font-medium text-gray-700 mb-2">
                        Encrypted Message
                    </label>
                    <textarea id="encrypted-message" rows="4"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50"
                        placeholder="Paste the encrypted message here..."></textarea>
                </div>

                <div>
                    <label for="secret-key" class="block text-sm font-medium text-gray-700 mb-2">
                        Secret Key
                    </label>
                    <input type="password" id="secret-key"
                        class="w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50"
                        placeholder="Enter the secret key">
                </div>

                <div class="mt-4 text-center">
                    <a href="sending_message.html" class="text-indigo-600 hover:text-indigo-500">
                        Want to send a message?
                    </a>
                </div>

                <div class="flex justify-end">
                    <button type="submit"
                        class="inline-flex items-center rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors duration-200">
                        Decrypt Message
                        <svg xmlns="http://www.w3.org/2000/svg" class="ml-2 h-4 w-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
                        </svg>
                    </button>
                </div>
            </form>

            <div id="decrypted-content" class="mt-6 hidden">
                <h2 class="text-lg font-medium text-gray-900 mb-2">Decrypted Message:</h2>
                <div class="rounded-lg bg-gray-50 p-4">
                    <p id="decrypted-text" class="text-gray-700"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        $("#decrypt-form").submit(async function (e) {
            e.preventDefault();
            const encryptedMessage = $("#encrypted-message").val().trim();
            const secretKey = $("#secret-key").val().trim();

            if (!encryptedMessage || !secretKey) {
                alert("Please enter both the encrypted message and secret key");
                return;
            }

            try {
                const decrypted = await decryptString(encryptedMessage, secretKey);
                $("#decrypted-text").text(decrypted);
                $("#decrypted-content").removeClass("hidden");
            } catch (error) {
                alert("Failed to decrypt message. Please check your secret key and try again.");
                console.error('Decryption error:', error);
            }
        });
    </script>
</body>

</html>
